# Verification gate. Everything that must be true before an artifact is allowed near a
# deployed environment.
#
# Exposed as `workflow_call` as well as running on its own, so the deploy workflows can
# require it *in the same run* rather than trusting that some earlier run of it passed
# on the same commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    outputs:
      image_digest:
        description: Digest of the image built and pushed by this run (main only).
        value: ${{ jobs.image.outputs.digest }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fitwar-backend

jobs:
  backend:
    name: Lint, typecheck, migrate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitwar
          POSTGRES_PASSWORD: fitwar_ci
          POSTGRES_DB: fitwar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitwar -d fitwar"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # Real Postgres, real Redis, real S3 API. The integration suites exercise row
      # locking, partial indexes, Redis sliding windows and presigned uploads — none of
      # which a mock reproduces, and all of which are where this codebase's bugs have
      # actually been.
      APP_ENV: ci
      APP_DEBUG: "false"
      APP_LOG_LEVEL: WARNING
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USER: fitwar
      DATABASE_PASSWORD: fitwar_ci
      DATABASE_NAME: fitwar
      REDIS_URL: redis://localhost:6379/0
      AUTH_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET_NAME: fitwar-media
      STORAGE_ACCESS_KEY_ID: fitwar_ci
      STORAGE_SECRET_ACCESS_KEY: fitwar_ci_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # GitHub's `services:` cannot override a container's command, and the MinIO image
      # needs `server /data`. Running it as an explicit step is the smaller workaround.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=fitwar_ci \
            -e MINIO_ROOT_PASSWORD=fitwar_ci_secret \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become ready" >&2
          docker logs minio >&2
          exit 1

      - name: Install dependencies
        run: |
          # The same hash-pinned set the image installs, so a green CI run and the
          # artifact it gates are not testing two different dependency trees.
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check .

      - name: MyPy
        run: mypy app

      - name: Alembic — full history against an empty database
        run: alembic upgrade head

      - name: Alembic — no drift between models and migrations
        # Fails if the ORM models describe a schema the migrations do not produce.
        run: alembic check

      - name: Alembic — downgrade/upgrade round trip
        # Proves the most recent migration is actually reversible, which is what makes
        # a rollback an option rather than a hope. Runs after `check` so a drifted
        # schema is reported as drift rather than as a confusing downgrade failure.
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Pytest
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    # Cheap failures first: no point building an image for code that does not typecheck.
    needs: backend
    # On main the `image` job builds and pushes the real artifact, so building here too
    # would be the same work twice.
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: backend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          # Tagged by commit SHA, never by a moving tag. Staging and production are then
          # deployed by digest, so "the same artifact" is a verifiable claim rather than
          # an assumption about what `:latest` pointed at when each one pulled.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
