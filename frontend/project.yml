name: FITWAR
options:
  bundleIdPrefix: com.fitwar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  FITWAR:
    type: application
    platform: iOS
    sources:
      - path: FITWAR
        excludes:
          - "App/Config/*.xcconfig"
    configFiles:
      Debug: FITWAR/App/Config/Debug.xcconfig
      Staging: FITWAR/App/Config/Staging.xcconfig
      Release: FITWAR/App/Config/Release.xcconfig
    info:
      path: FITWAR/Resources/Info.plist
      properties:
        CFBundleDisplayName: FITWAR
        UILaunchScreen: {}
        API_BASE_URL: $(API_BASE_URL)
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitwar.app
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"

  FITWARTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FITWARTests
    dependencies:
      - target: FITWAR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fitwar.app.tests

  FITWARUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FITWARUITests
    dependencies:
      - target: FITWAR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.fitwar.app.uitests

schemes:
  FITWAR:
    build:
      targets:
        FITWAR: all
        FITWARTests: [test]
        FITWARUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FITWARTests
        - FITWARUITests
    archive:
      config: Release
