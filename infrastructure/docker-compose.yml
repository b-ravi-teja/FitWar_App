services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitwar
      POSTGRES_PASSWORD: fitwar_local_dev_password
      POSTGRES_DB: fitwar
    ports:
      # Host-side 5433, not 5432: avoids colliding with any Postgres already
      # running natively on the host. Container-to-container traffic (the api
      # service) still uses the standard 5432 internally, unaffected by this.
      - "5433:5432"
    volumes:
      - fitwar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitwar -d fitwar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host-side 6380 — same collision-avoidance reasoning as postgres above.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fitwar_local
      MINIO_ROOT_PASSWORD: fitwar_local_dev_secret
    ports:
      # 9000 = S3 API, 9001 = web console. Same collision-avoidance reasoning as the
      # postgres/redis host ports above.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fitwar_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      # The dev image: hot reload plus the dev dependencies the bind mounts below rely
      # on. `Dockerfile` is the production build — no reload, no dev deps, non-root.
      dockerfile: Dockerfile.dev
    env_file:
      - ../backend/.env.local
    environment:
      # Overrides env_file: inside the compose network, services are reached by
      # name, not localhost.
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      # tests/ is deliberately excluded from the image itself (.dockerignore) to
      # keep the production build lean; bind-mounted here so `docker compose exec
      # api pytest` works for local dev without baking test code into the image.
      - ../backend/tests:/app/tests
      - ../backend/pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Periodic jobs: the challenge-day deadline sweep and media retention (Architecture
  # §35). Deliberately a separate service from `api` — a sweep that overruns must not
  # compete with request handling, and the two scale independently.
  #
  # Both jobs are idempotent and safe to run concurrently with themselves, so this is
  # not a singleton: correctness comes from database constraints, not from there being
  # exactly one runner. A platform with a native scheduler can instead run
  # `python -m app.workers.deadline_sweep` / `media_cleanup` on a cron and set
  # SCHEDULER_DISABLED_JOBS to turn these off.
  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command: ["python", "-m", "app.workers.scheduler"]
    env_file:
      - ../backend/.env.local
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT_URL: http://minio:9000
    volumes:
      - ../backend/app:/app/app
      - ../backend/pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  fitwar_postgres_data:
  fitwar_minio_data:
